<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blind Auction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;

            background:
                radial-gradient(circle at 15% 20%, rgba(255, 215, 150, 0.12), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(180, 150, 100, 0.10), transparent 30%),
                #171512;

            color: #f4efe5;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .auction {
            width: 620px;
            max-width: 100%;

            background: #211e19;

            border: 1px solid #51483a;

            border-radius: 18px;

            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);

            overflow: hidden;
        }

        .header {
            text-align: center;

            padding: 38px 25px 28px;

            background: #252119;

            border-bottom: 1px solid #51483a;
        }

        .hammer {
            font-size: 50px;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0;

            font-size: 38px;

            letter-spacing: 1px;

            color: #e5c47b;
        }

        .subtitle {
            margin: 10px 0 0;

            color: #b9b0a1;

            font-family: Arial, sans-serif;

            font-size: 14px;
        }

        .item {
            margin: 25px;

            padding: 25px;

            border-radius: 14px;

            background: #191714;

            border: 1px solid #3f382e;

            text-align: center;
        }

        .item-label {
            font-family: Arial, sans-serif;

            font-size: 11px;

            letter-spacing: 2px;

            color: #a9997c;

            text-transform: uppercase;
        }

        .item h2 {
            margin: 10px 0 5px;

            font-size: 25px;

            color: #f0e8d9;
        }

        .item p {
            margin: 0;

            color: #958c7e;

            font-family: Arial, sans-serif;

            font-size: 13px;
        }

        .form {
            padding: 0 35px 30px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-family: Arial, sans-serif;

            font-size: 13px;

            color: #c9c0b2;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            margin-bottom: 20px;

            background: #302b24;

            border: 1px solid #51483a;

            border-radius: 9px;

            color: #f5efe5;

            font-size: 15px;

            outline: none;

            font-family: Arial, sans-serif;
        }

        input:focus {
            border-color: #c5a45e;

            box-shadow: 0 0 0 3px rgba(197, 164, 94, 0.10);
        }

        input::placeholder {
            color: #777064;
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 9px;

            font-family: Arial, sans-serif;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .bid-button {
            background: #b18b43;

            color: #17130d;
        }

        .bid-button:hover {
            background: #c8a55d;

            transform: translateY(-2px);
        }

        .status {
            display: none;

            margin: 0 35px 30px;

            padding: 20px;

            text-align: center;

            background: #28241d;

            border: 1px solid #51483a;

            border-radius: 12px;
        }

        .status.show {
            display: block;
        }

        .status-icon {
            font-size: 30px;

            margin-bottom: 8px;
        }

        .status-title {
            color: #d7b76c;

            font-weight: bold;

            font-size: 17px;
        }

        .status-text {
            margin-top: 7px;

            color: #a69c8d;

            font-family: Arial, sans-serif;

            font-size: 13px;
        }

        .winner {
            display: none;

            margin: 0 35px 35px;

            padding: 28px;

            text-align: center;

            background: linear-gradient(145deg, #30291d, #241f17);

            border: 1px solid #876d39;

            border-radius: 13px;
        }

        .winner.show {
            display: block;

            animation: appear 0.4s ease;
        }

        .winner-icon {
            font-size: 40px;
        }

        .winner small {
            font-family: Arial, sans-serif;

            color: #a69b89;

            font-size: 11px;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }

        .winner h2 {
            margin: 8px 0;

            color: #e4c16f;

            font-size: 28px;
        }

        .winner-price {
            font-family: Arial, sans-serif;

            font-size: 22px;

            color: #f1eadc;

            font-weight: bold;
        }

        .reset {
            width: auto;

            margin-top: 20px;

            padding: 10px 20px;

            border: 1px solid #63543b;

            background: transparent;

            color: #bdb19f;
        }

        .reset:hover {
            background: #342e25;
        }

        .end-section {
            padding: 0 35px 35px;
        }

        .end-button {
            background: #40382d;

            color: #e5c47b;

            border: 1px solid #63543b;
        }

        .end-button:hover {
            background: #4b4032;
        }

        .footer {
            text-align: center;

            padding: 15px;

            border-top: 1px solid #3c352c;

            color: #686156;

            font-family: Arial, sans-serif;

            font-size: 11px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 550px) {

            body {
                padding: 12px;
            }

            .header {
                padding: 30px 18px 22px;
            }

            h1 {
                font-size: 30px;
            }

            .form,
            .end-section {
                padding-left: 22px;
                padding-right: 22px;
            }

            .status,
            .winner {
                margin-left: 22px;
                margin-right: 22px;
            }

            .item {
                margin: 20px 22px;
            }
        }
    </style>
</head>


<body>

<div class="auction">

    <div class="header">

        <div class="hammer">🔨</div>

        <h1>Blind Auction</h1>

        <p class="subtitle">
            Place your secret bid. Highest bidder wins.
        </p>

    </div>


    <div class="item">

        <div class="item-label">
            Featured Auction
        </div>

        <h2>Mystery Auction Item</h2>

        <p>
            Every bidder submits a private offer.
        </p>

    </div>


    <div class="form" id="form">

        <label for="name">
            Your Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >


        <label for="bid">
            Your Secret Bid ($)
        </label>

        <input
            type="number"
            id="bid"
            placeholder="Enter your bid"
            min="1"
        >


        <button
            class="bid-button"
            onclick="placeBid()"
        >
            🔨 Submit Secret Bid
        </button>

    </div>


    <div class="status" id="status">

        <div class="status-icon">
            🔒
        </div>

        <div class="status-title">
            Bid submitted privately
        </div>

        <div class="status-text">
            Your bid has been recorded and hidden.
        </div>

    </div>


    <div class="end-section" id="endSection">

        <button
            class="end-button"
            onclick="finishAuction()"
        >
            🏆 End Auction & Reveal Winner
        </button>

    </div>


    <div class="winner" id="winner">

        <div class="winner-icon">
            🏆
        </div>

        <small>
            Auction Winner
        </small>

        <h2 id="winnerName"></h2>

        <div class="winner-price" id="winnerPrice"></div>

        <button
            class="reset"
            onclick="resetAuction()"
        >
            Start New Auction
        </button>

    </div>


    <div class="footer">
        🔒 All bids remain hidden until the auction ends.
    </div>

</div>


<script>

    let bids = [];


    function placeBid() {

        const name =
            document.getElementById("name").value.trim();

        const bid =
            Number(document.getElementById("bid").value);


        if (name === "") {

            alert("Please enter your name.");

            return;
        }


        if (bid <= 0 || isNaN(bid)) {

            alert("Please enter a valid bid.");

            return;
        }


        bids.push({
            name: name,
            amount: bid
        });


        // Clear the inputs immediately.
        document.getElementById("name").value = "";

        document.getElementById("bid").value = "";


        // Do NOT display the bidder or bid amount.
        document.getElementById("status")
            .classList.add("show");
    }


    function finishAuction() {

        if (bids.length === 0) {

            alert("No bids have been submitted yet.");

            return;
        }


        let winner = bids[0];


        for (let i = 1; i < bids.length; i++) {

            if (bids[i].amount > winner.amount) {

                winner = bids[i];
            }
        }


        document.getElementById("winnerName")
            .textContent = winner.name;


        document.getElementById("winnerPrice")
            .textContent =
            "$" + winner.amount.toLocaleString();


        document.getElementById("winner")
            .classList.add("show");


        document.getElementById("form")
            .style.display = "none";


        document.getElementById("status")
            .classList.remove("show");


        document.getElementById("endSection")
            .style.display = "none";
    }


    function resetAuction() {

        bids = [];


        document.getElementById("winner")
            .classList.remove("show");


        document.getElementById("form")
            .style.display = "block";


        document.getElementById("endSection")
            .style.display = "block";


        document.getElementById("status")
            .classList.remove("show");
    }


</script>

</body>

</html>
