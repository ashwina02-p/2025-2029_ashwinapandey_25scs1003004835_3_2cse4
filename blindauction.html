<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blind Auction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;

            background:
                radial-gradient(circle at 15% 20%, rgba(255, 215, 150, 0.12), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(180, 150, 100, 0.10), transparent 30%),
                #171512;

            color: #f4efe5;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .auction {
            width: 650px;
            max-width: 100%;

            background: #211e19;

            border: 1px solid #51483a;

            border-radius: 18px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55);

            overflow: hidden;
        }

        /* HEADER */

        .header {
            text-align: center;

            padding: 35px 25px 25px;

            background: #252119;

            border-bottom: 1px solid #51483a;
        }

        .hammer {
            font-size: 48px;

            margin-bottom: 8px;
        }

        h1 {
            margin: 0;

            font-size: 38px;

            letter-spacing: 1px;

            color: #e5c47b;
        }

        .subtitle {
            margin: 10px 0 0;

            color: #b9b0a1;

            font-family: Arial, sans-serif;

            font-size: 14px;

            letter-spacing: 0.5px;
        }

        /* AUCTION ITEM */

        .item {
            margin: 25px;

            padding: 25px;

            border-radius: 14px;

            background: #191714;

            border: 1px solid #3f382e;

            text-align: center;
        }

        .item-label {
            font-family: Arial, sans-serif;

            font-size: 11px;

            letter-spacing: 2px;

            color: #a9997c;

            text-transform: uppercase;
        }

        .item h2 {
            margin: 10px 0 5px;

            font-size: 25px;

            color: #f0e8d9;
        }

        .item p {
            margin: 0;

            color: #958c7e;

            font-family: Arial, sans-serif;

            font-size: 13px;
        }

        /* FORM */

        .form {
            padding: 0 35px 30px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-family: Arial, sans-serif;

            font-size: 13px;

            color: #c9c0b2;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            margin-bottom: 20px;

            background: #302b24;

            border: 1px solid #51483a;

            border-radius: 9px;

            color: #f5efe5;

            font-size: 15px;

            outline: none;

            font-family: Arial, sans-serif;

            transition: 0.2s;
        }

        input:focus {
            border-color: #c5a45e;

            box-shadow: 0 0 0 3px rgba(197, 164, 94, 0.10);
        }

        input::placeholder {
            color: #777064;
        }

        /* BUTTON */

        .bid-button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 9px;

            background: #b18b43;

            color: #17130d;

            font-family: Arial, sans-serif;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .bid-button:hover {
            background: #c8a55d;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .bid-button:active {
            transform: scale(0.98);
        }

        /* BID LIST */

        .bids-section {
            padding: 0 35px 30px;
        }

        .section-title {
            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom: 1px solid #40382e;

            padding-bottom: 10px;

            margin-bottom: 12px;
        }

        .section-title span:first-child {
            font-size: 17px;

            color: #ded4c2;
        }

        .section-title span:last-child {
            font-family: Arial, sans-serif;

            font-size: 11px;

            color: #8f8677;
        }

        #bidList {
            max-height: 180px;

            overflow-y: auto;
        }

        .bid {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 12px 14px;

            margin-bottom: 7px;

            background: #2a261f;

            border-radius: 8px;

            font-family: Arial, sans-serif;

            font-size: 13px;
        }

        .bid-name {
            color: #d5ccbd;
        }

        .bid-price {
            color: #d7b76c;

            font-weight: bold;
        }

        .empty {
            text-align: center;

            color: #777064;

            font-family: Arial, sans-serif;

            font-size: 13px;

            padding: 15px;
        }

        /* WINNER */

        .winner {
            display: none;

            margin: 0 35px 35px;

            padding: 25px;

            text-align: center;

            background: linear-gradient(
                145deg,
                #30291d,
                #241f17
            );

            border: 1px solid #876d39;

            border-radius: 13px;
        }

        .winner.show {
            display: block;

            animation: appear 0.4s ease;
        }

        .winner-icon {
            font-size: 38px;

            margin-bottom: 8px;
        }

        .winner small {
            font-family: Arial, sans-serif;

            color: #a69b89;

            font-size: 11px;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }

        .winner h2 {
            margin: 8px 0;

            color: #e4c16f;

            font-size: 26px;
        }

        .winner-price {
            font-family: Arial, sans-serif;

            font-size: 22px;

            color: #f1eadc;

            font-weight: bold;
        }

        .reset {
            margin-top: 18px;

            padding: 9px 18px;

            border: 1px solid #63543b;

            border-radius: 7px;

            background: transparent;

            color: #bdb19f;

            cursor: pointer;

            font-family: Arial, sans-serif;
        }

        .reset:hover {
            background: #342e25;
        }

        .footer {
            text-align: center;

            padding: 15px;

            border-top: 1px solid #3c352c;

            color: #686156;

            font-family: Arial, sans-serif;

            font-size: 11px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 550px) {

            body {
                padding: 12px;
            }

            .header {
                padding: 28px 18px 22px;
            }

            h1 {
                font-size: 30px;
            }

            .form,
            .bids-section {
                padding-left: 22px;
                padding-right: 22px;
            }

            .item {
                margin: 20px 22px;
            }

            .winner {
                margin-left: 22px;
                margin-right: 22px;
            }
        }
    </style>
</head>


<body>

<div class="auction">

    <div class="header">

        <div class="hammer">🔨</div>

        <h1>Blind Auction</h1>

        <p class="subtitle">
            Place your secret bid. Highest bidder wins.
        </p>

    </div>


    <div class="item">

        <div class="item-label">
            Featured Auction
        </div>

        <h2>Mystery Auction Item</h2>

        <p>
            Every bidder submits a private offer.
        </p>

    </div>


    <div class="form">

        <label for="name">
            Your Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >


        <label for="bid">
            Your Bid ($)
        </label>

        <input
            type="number"
            id="bid"
            placeholder="Enter your bid"
            min="1"
        >


        <button
            class="bid-button"
            onclick="placeBid()"
        >
            🔨 Place Secret Bid
        </button>

    </div>


    <div class="bids-section">

        <div class="section-title">

            <span>Current Bidders</span>

            <span id="bidCount">
                0 BIDS
            </span>

        </div>

        <div id="bidList">

            <div class="empty">
                No bids have been placed yet.
            </div>

        </div>

    </div>


    <div class="winner" id="winner">

        <div class="winner-icon">
            🏆
        </div>

        <small>
            Auction Winner
        </small>

        <h2 id="winnerName"></h2>

        <div class="winner-price" id="winnerPrice"></div>

        <button
            class="reset"
            onclick="resetAuction()"
        >
            Start New Auction
        </button>

    </div>


    <div class="footer">
        All bids are hidden until the auction ends.
    </div>

</div>


<script>

    let bids = [];


    function placeBid() {

        const name =
            document.getElementById("name").value.trim();

        const bid =
            Number(document.getElementById("bid").value);


        if (name === "") {

            alert("Please enter your name.");

            return;
        }


        if (bid <= 0 || isNaN(bid)) {

            alert("Please enter a valid bid.");

            return;
        }


        bids.push({
            name: name,
            amount: bid
        });


        document.getElementById("name").value = "";

        document.getElementById("bid").value = "";


        updateBidList();
    }


    function updateBidList() {

        const list =
            document.getElementById("bidList");

        const count =
            document.getElementById("bidCount");


        count.textContent =
            bids.length + (bids.length === 1 ? " BID" : " BIDS");


        list.innerHTML = "";


        if (bids.length === 0) {

            list.innerHTML =
                '<div class="empty">No bids have been placed yet.</div>';

            return;
        }


        bids.forEach(function(bid) {

            const div =
                document.createElement("div");

            div.className = "bid";

            div.innerHTML = `
                <span class="bid-name">
                    ${escapeHTML(bid.name)}
                </span>

                <span class="bid-price">
                    $${bid.amount.toLocaleString()}
                </span>
            `;

            list.appendChild(div);
        });
    }


    function finishAuction() {

        if (bids.length === 0) {

            alert("Place at least one bid first.");

            return;
        }


        let winner = bids[0];


        for (let i = 1; i < bids.length; i++) {

            if (bids[i].amount > winner.amount) {

                winner = bids[i];
            }
        }


        document.getElementById("winnerName").textContent =
            winner.name;

        document.getElementById("winnerPrice").textContent =
            "$" + winner.amount.toLocaleString();


        document.getElementById("winner").classList.add("show");

        document.querySelector(".bids-section").style.display =
            "none";

        document.querySelector(".form").style.display =
            "none";
    }


    function resetAuction() {

        bids = [];


        document.getElementById("winner")
            .classList.remove("show");


        document.querySelector(".bids-section")
            .style.display = "block";


        document.querySelector(".form")
            .style.display = "block";


        updateBidList();
    }


    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    // Finish the auction when the user presses
    // Enter after adding bids.

    document.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            const active =
                document.activeElement;

            if (
                active.id === "name" ||
                active.id === "bid"
            ) {
                placeBid();
            }
        }
    });

</script>

</body>
</html>
