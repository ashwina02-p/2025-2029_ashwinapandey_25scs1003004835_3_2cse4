<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .game {
            width: 520px;
            max-width: 92%;
            padding: 40px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0;
            font-size: 38px;
        }

        .subtitle {
            margin-top: 10px;
            color: #d7dce5;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
        }

        .score {
            background: rgba(255, 255, 255, 0.12);
            padding: 15px 30px;
            border-radius: 15px;
            min-width: 130px;
        }

        .score span {
            display: block;
            font-size: 35px;
            font-weight: bold;
            margin-top: 5px;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .choice {
            width: 120px;
            height: 120px;
            border: none;
            border-radius: 20px;
            background: white;
            font-size: 48px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .choice:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }

        .choice:active {
            transform: scale(0.95);
        }

        .battle {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 25px 0;
        }

        .player-choice,
        .computer-choice {
            font-size: 55px;
        }

        .battle p {
            margin: 5px 0;
            color: #d7dce5;
        }

        .vs {
            font-size: 25px;
            font-weight: bold;
        }

        #result {
            font-size: 26px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 32px;
        }

        #message {
            color: #d7dce5;
            min-height: 24px;
        }

        .reset {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #243b55;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset:hover {
            transform: scale(1.05);
        }

        @media (max-width: 450px) {
            h1 {
                font-size: 30px;
            }

            .choice {
                width: 90px;
                height: 90px;
                font-size: 38px;
            }

            .score {
                min-width: 105px;
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<div class="game">

    <h1>🎮 Rock Paper Scissors</h1>

    <p class="subtitle">Choose your move and beat the computer!</p>

    <div class="score-board">

        <div class="score">
            You
            <span id="playerScore">0</span>
        </div>

        <div class="score">
            Computer
            <span id="computerScore">0</span>
        </div>

    </div>

    <div class="battle">

        <div>
            <div class="player-choice" id="playerChoice">❔</div>
            <p>You</p>
        </div>

        <div class="vs">VS</div>

        <div>
            <div class="computer-choice" id="computerChoice">❔</div>
            <p>Computer</p>
        </div>

    </div>

    <div id="result">Make your move!</div>

    <div id="message">
        Choose Rock, Paper or Scissors
    </div>

    <div class="choices">

        <button class="choice" onclick="playGame('rock')">
            🪨
        </button>

        <button class="choice" onclick="playGame('paper')">
            📄
        </button>

        <button class="choice" onclick="playGame('scissors')">
            ✂️
        </button>

    </div>

    <button class="reset" onclick="resetGame()">
        🔄 Reset Game
    </button>

</div>

<script>

let playerScore = 0;
let computerScore = 0;

const emojis = {
    rock: "🪨",
    paper: "📄",
    scissors: "✂️"
};

function playGame(playerChoice) {

    const choices = ["rock", "paper", "scissors"];

    const computerChoice =
        choices[Math.floor(Math.random() * choices.length)];

    document.getElementById("playerChoice").textContent =
        emojis[playerChoice];

    document.getElementById("computerChoice").textContent =
        emojis[computerChoice];

    let result;

    if (playerChoice === computerChoice) {

        result = "It's a Draw! 🤝";

    } else if (

        (playerChoice === "rock" && computerChoice === "scissors") ||
        (playerChoice === "paper" && computerChoice === "rock") ||
        (playerChoice === "scissors" && computerChoice === "paper")

    ) {

        result = "You Win! 🎉";
        playerScore++;

    } else {

        result = "You Lose! 😢";
        computerScore++;

    }

    document.getElementById("result").textContent = result;

    document.getElementById("playerScore").textContent =
        playerScore;

    document.getElementById("computerScore").textContent =
        computerScore;

    document.getElementById("message").textContent =
        "You chose " + playerChoice +
        " • Computer chose " + computerChoice;
}

function resetGame() {

    playerScore = 0;
    computerScore = 0;

    document.getElementById("playerScore").textContent = "0";
    document.getElementById("computerScore").textContent = "0";

    document.getElementById("playerChoice").textContent = "❔";
    document.getElementById("computerChoice").textContent = "❔";

    document.getElementById("result").textContent =
        "Make your move!";

    document.getElementById("message").textContent =
        "Choose Rock, Paper or Scissors";
}

</script>

</body>
</html>
